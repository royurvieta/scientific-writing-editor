name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile scripts
        run: python3 -m py_compile skills/scientific-writing-editor/scripts/check_fidelity.py scripts/build_packages.py
      - name: Build packages
        run: python3 scripts/build_packages.py dist
      - name: Verify archive
        run: |
          unzip -t dist/scientific-writing-editor.zip
          unzip -l dist/scientific-writing-editor.zip
